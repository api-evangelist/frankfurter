openapi: 3.2.0
info:
  title: Frankfurter Currencies API
  description: Frankfurter is an open-source API for current and historical foreign exchange rates published by central banks.
  version: 2.1.1
  license:
    name: MIT
    url: https://github.com/lineofflight/frankfurter/blob/main/LICENSE
  contact:
    url: https://github.com/lineofflight/frankfurter/issues
servers:
- url: https://api.frankfurter.dev/v2
tags:
- name: Currencies
paths:
  /currencies:
    get:
      operationId: getCurrencies
      summary: Get available currencies
      description: Returns available currencies with their names and publication date ranges. Without providers, the catalogue covers eligible daily sources plus pegged currencies; scope=all also includes historical currencies. With providers, it covers recognized currencies published by those sources, including period-only history. These dates do not guarantee a queryable base/quote pair; use /coverage with matching query filters. By default, only active currencies are included.
      parameters:
      - name: scope
        in: query
        description: Set to 'all' to include legacy currencies. Omit for the default list. Other values, including an empty string, return 422.
        required: false
        schema:
          type: string
          enum:
          - all
      - $ref: '#/components/parameters/providers'
      responses:
        '200':
          description: Available currencies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Currency'
              example:
              - iso_code: EUR
                iso_numeric: '978'
                name: Euro
                symbol: €
                start_date: '1999-01-04'
                end_date: '2026-03-17'
              - iso_code: USD
                iso_numeric: '840'
                name: United States Dollar
                symbol: $
                start_date: '1999-01-04'
                end_date: '2026-03-17'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      tags:
      - Currencies
components:
  responses:
    UnprocessableEntity:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
  schemas:
    Currency:
      type: object
      properties:
        iso_code:
          type: string
          description: Currency or accounting unit code
        iso_numeric:
          type:
          - string
          - 'null'
          description: ISO 4217 numeric code
        name:
          type: string
          description: Full currency name
        symbol:
          type:
          - string
          - 'null'
          description: Currency symbol
        start_date:
          type:
          - string
          - 'null'
          format: date
          description: Earliest publication coverage date; use /coverage for queryable pairs
        end_date:
          type:
          - string
          - 'null'
          format: date
          description: Latest publication coverage date; use /coverage for queryable pairs
      required:
      - iso_code
      - name
  parameters:
    providers:
      name: providers
      in: query
      description: Comma-separated list of data providers to include. A single provider includes its stored non-currency series. Selecting multiple providers blends only registered currencies and accounting units.
      required: false
      schema:
        type: string
        example: ECB,TCMB
x-provenance:
  method: harvested
  publisher: Frankfurter
  source: https://api.frankfurter.dev/v2/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
