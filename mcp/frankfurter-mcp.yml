tools:
- name: get_rates
  description: 'Latest or a single day''s exchange rates. The raw-rate companion to `convert`. With `provider`,
    published rates from one or more institutions: on its own base the digits are as published, with the
    date they took effect.'
- name: convert
  description: Convert an amount from one currency to another. Returns {amount, currency} rounded to the
    target's minor units. Upstream rounds rates per direction; for low-value sources, flip via `get_rates`
    for more precision. Pass `provider` to use one institution's published rate, e.g. UST for a U.S. Treasury
    reporting rate.
- name: list_currencies
  description: 'List all supported ISO 4217 currency codes and their full names (e.g. { ''USD'': ''United
    States Dollar'' }).'
- name: list_providers
  description: List the institutions whose rates Frankfurter relays, with key, rate type, frequency (daily,
    monthly or quarterly) and coverage dates. Use a key as `provider` in `convert` or `get_rates` for
    that institution's published rates instead of the blend.
